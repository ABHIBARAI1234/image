<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Generator | Glassmorphism Edition</title>
  
  <!-- Bootstrap 5 CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  />
  <!-- Font Awesome Icons -->
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
  />
  <!-- Advanced Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="container py-5 max-w-900">
    
    <!-- Header Section -->
    <header class="text-center mb-5">
      <div class="badge bg-glass-badge mb-3 px-3 py-2 rounded-pill border">
        <i class="fa-solid fa-sparkles text-accent me-1"></i> Powered by FLUX & SDXL
      </div>
      <h1 class="display-4 fw-bold gradient-text mb-2">
        <i class="fa-solid fa-wand-magic-sparkles me-2"></i>AI Image Generator
      </h1>
      <p class="text-muted lead fs-6 mx-auto max-w-600">
        Turn your imagination into stunning high-resolution digital visual art in seconds.
      </p>
    </header>

    <!-- Generator Control Panel (Bootstrap Glass Card) -->
    <section class="card glass-card border-0 p-4 p-md-5 mb-5">
      <form id="promptForm">
        
        <!-- Prompt Input Field -->
        <div class="mb-4">
          <label for="promptInput" class="form-label text-uppercase fw-semibold text-muted small tracking-wide">
            <i class="fa-solid fa-terminal me-1 text-accent"></i> Enter Prompt
          </label>
          <textarea 
            id="promptInput" 
            class="form-control glass-input shadow-none" 
            rows="3" 
            placeholder="An astronaut riding a glowing neon horse on Mars, digital art, 8k resolution..." 
            required
          ></textarea>
        </div>

        <!-- Controls Grid -->
        <div class="row g-3 mb-4">
          
          <!-- Image Quantity -->
          <div class="col-12 col-md-4">
            <label for="imageCount" class="form-label text-uppercase fw-semibold text-muted small tracking-wide">
              <i class="fa-solid fa-layer-group me-1 text-accent"></i> Quantity
            </label>
            <select id="imageCount" class="form-select glass-input shadow-none">
              <option value="1" selected>1 Image</option>
              <option value="2">2 Images</option>
              <option value="3">3 Images</option>
              <option value="4">4 Images</option>
            </select>
          </div>

          <!-- Aspect Ratio -->
          <div class="col-12 col-md-4">
            <label for="aspectRatio" class="form-label text-uppercase fw-semibold text-muted small tracking-wide">
              <i class="fa-solid fa-expand me-1 text-accent"></i> Aspect Ratio
            </label>
            <select id="aspectRatio" class="form-select glass-input shadow-none">
              <option value="1:1" selected>1:1 (Square)</option>
              <option value="16:9">16:9 (Landscape)</option>
              <option value="9:16">9:16 (Portrait)</option>
              <option value="4:3">4:3 (Standard)</option>
            </select>
          </div>

          <!-- AI Model -->
          <div class="col-12 col-md-4">
            <label for="modelSelect" class="form-label text-uppercase fw-semibold text-muted small tracking-wide">
              <i class="fa-solid fa-robot me-1 text-accent"></i> AI Model
            </label>
            <select id="modelSelect" class="form-select glass-input shadow-none">
              <option value="flux">FLUX.1-Schnell</option>
              <option value="sdxl">Stable Diffusion XL</option>
            </select>
          </div>

        </div>

        <!-- Action Buttons -->
        <div class="d-flex flex-column flex-sm-row justify-content-end gap-3 pt-2">
          <button type="button" class="btn btn-glass-secondary" id="randomBtn">
            <i class="fa-solid fa-dice me-2"></i> Surprise Me
          </button>
          <button type="submit" class="btn btn-gradient-primary" id="generateBtn">
            <i class="fa-solid fa-bolt me-2"></i> Generate Image
          </button>
        </div>

      </form>
    </section>

    <!-- Gallery / Output Grid -->
    <section>
      <div class="row g-4" id="imageGrid">
        
        <!-- Default Placeholder Card -->
        <div class="col-12">
          <div class="card glass-card border-dashed p-5 text-center">
            <div class="py-4">
              <i class="fa-regular fa-image display-1 text-dim mb-3"></i>
              <h5 class="text-muted fw-normal">Your generated artwork will appear here</h5>
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
